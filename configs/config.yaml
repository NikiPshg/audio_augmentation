# audio_augmentation config.
# Every key is optional - anything you omit falls back to the library
# defaults (see audio_augmentation.DEFAULT_CONFIG).

sample_rate: 16000
max_length_seconds: null   # random-crop longer inputs; null = keep full length
seed: null                 # base seed for reproducible augmentation; null = random

noise:
  prob: 0.5
  dir: null                # path to a folder with noise audio; null = synthetic pink/white noise
  extensions: [.wav, .flac, .mp3, .ogg, .opus]
  snr_db: [2.0, 30.0]
  segment_ratio: [0.2, 1.0]   # fraction of the utterance covered by noise

rir:
  prob: 0.5
  rt60: [0.15, 0.8]        # reverberation time, seconds
  drr_db: [-2.0, 12.0]     # direct-to-reverberant ratio; lower = wetter

codec:
  prob: 0.5
  # weight = relative pick probability (default 1.0). opus encoding is the
  # slowest by far (~25 ms per 4 s clip), hence the lower default weights.
  codecs:
    mp3:      {format: mp3,  bit_rate: [8000, 64000]}
    vorbis:   {format: ogg,  bit_rate: [16000, 64000]}
    speex_8k: {format: spx,  bit_rate: [4000, 12000], sample_rate: 8000}
    opus:     {format: opus, bit_rate: [6000, 32000], weight: 0.5}
    opus_8k:  {format: opus, bit_rate: [4000, 16000], sample_rate: 8000, weight: 0.5}

effects:
  prob: 0.5
  max_stack: 2
  effects: [lowpass, highpass, bandpass, bandreject, eq, tremolo, clip, gain]

phone:
  prob: 0.5
  codec: g711              # g711 (pure torch, ~1 ms) | spx | opus (ffmpeg round trip)
  bit_rate: [4000, 12000]  # used by spx/opus only
